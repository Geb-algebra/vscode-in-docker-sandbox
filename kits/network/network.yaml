# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: VS Code development network access
description: Allows the additional domains required by VS Code and the shared development tools.
version: "1.0.0"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Additional domains not covered by the required balanced host policy.
          - "vscode.download.prss.microsoft.com:443"
          - "main.vscode-cdn.net:443"
          - "*.gallery.vsassets.io:443"
          - "*.gallerycdn.vsassets.io:443"
          - "ui.shadcn.com:443"
