schemaVersion: "1"
kind: mixin
name: vscode-in-docker-sandbox
displayName: VS Code development environment
description: Adds pinned development tools and shared VS Code preferences to a Codex sandbox.

environment:
  variables:
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    PLAYWRIGHT_MCP_BROWSER: chromium

# BEGIN TEMPORARY WORKAROUND: docker/sbx-releases#366
# Custom template layers are unreliable on sbx 0.37.x. In 0.37.0, install
# commands run before Kit static files are available, so this startup wrapper
# uses a persistent marker to perform the real install once per sandbox.
# Remove this block as described in the workaround memo.
commands:
  startup:
    - command:
        - bash
        - /home/agent/.local/share/vscode-in-sandbox/install-toolchain-once.sh
      user: "0"
      description: Ensure pinned development tools are installed
# END TEMPORARY WORKAROUND: docker/sbx-releases#366

caps:
  network:
    allow:
      # Additional domains not covered by the required balanced host policy.
      - "www.python.org:443"
      - "cdn.playwright.dev:443"
      - "playwright.download.prss.microsoft.com:443"
      - "vscode.download.prss.microsoft.com:443"
      - "main.vscode-cdn.net:443"
      - "*.gallery.vsassets.io:443"
      - "*.gallerycdn.vsassets.io:443"
      - "ui.shadcn.com:443"
