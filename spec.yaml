schemaVersion: "1"
kind: mixin
name: vscode-in-docker-sandbox
displayName: VS Code OpenSSH development environment
description: Adds OpenSSH, pinned development tools, VS Code, and shared VS Code preferences to a Codex sandbox.

caps:
  network:
    allow:
      # Additional domains not covered by the required balanced host policy.
      - "www.python.org:443"
      - "vscode.download.prss.microsoft.com:443"
      - "main.vscode-cdn.net:443"
      - "*.gallery.vsassets.io:443"
      - "*.gallerycdn.vsassets.io:443"
