schemaVersion: "1"
kind: mixin
name: vscode-in-docker-sandbox
displayName: VS Code Tunnel development environment
description: Adds pinned Node.js, pnpm, Python, uv, VS Code Tunnel, and shared VS Code preferences to a Codex sandbox.

caps:
  network:
    allow:
      # Additional domains not covered by the required balanced host policy.
      - "www.python.org:443"
      - "vscode.download.prss.microsoft.com:443"
      - "main.vscode-cdn.net:443"
      - "*.gallery.vsassets.io:443"
      - "*.gallerycdn.vsassets.io:443"
      - "*.servicebus.windows.net:443"

environment:
  variables:
    VSCODE_CLI_USE_FILE_KEYCHAIN: "1"
